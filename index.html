<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assortimentslijst downloaden</title>
  <style>
    :root {
      --bg: #f6f7f5;
      --card: #ffffff;
      --text: #1a1f16;
      --muted: #5c6358;
      --accent: #2d5a3d;
      --accent-hover: #234a30;
      --border: #dfe3db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 28rem;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
      font-weight: 600;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    a.btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      border: none;
      cursor: pointer;
    }
    a.btn:hover {
      background: var(--accent-hover);
    }
    a.btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>

    <a

</body>
</html>
